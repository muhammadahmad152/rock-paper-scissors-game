<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-card">
        <h1>Rock Paper Scissors</h1>

        <!-- Mode Selection -->
        <div class="mode-select">
            <label for="game-mode">Target Points:</label>
            <select id="game-mode">
                <option value="0">Endless</option>
                <option value="3">Best of 3</option>
                <option value="5" selected>Best of 5</option>
            </select>
        </div>

        <!-- High Score Display -->
        <div class="high-score">
            High Score: <span id="high-score">0</span>
        </div>

        <!-- Scores -->
        <div class="scoreboard">
            <div class="score-box">
                <span class="label">You</span>
                <span id="user-score" class="score">0</span>
            </div>
            <div class="score-box">
                <span class="label">Computer</span>
                <span id="computer-score" class="score">0</span>
            </div>
        </div>

        <!-- Move Choices Showcase -->
        <div class="battlefield">
            <div id="player-choice" class="choice-display">❓</div>
            <span class="vs">VS</span>
            <div id="computer-choice" class="choice-display">❓</div>
        </div>

        <!-- Controls -->
        <p class="instruction">Choose your move:</p>
        <div class="buttons">
            <button id="rock" aria-label="Rock">&#x1F44A;</button>
            <button id="paper" aria-label="Paper">&#x1f590;</button>
            <button id="scissors" aria-label="Scissors">&#x270c;</button>
        </div>

        <!-- Status & Result -->
        <p id="result">Select an option to play!</p>

        <!-- Action Buttons -->
        <button id="reset-btn">Reset Game</button>

        <!-- Round History -->
        <div class="history-container">
            <h3>Match History</h3>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
